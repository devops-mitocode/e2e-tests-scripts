webdriver.wait.for.timeout=10000  # en milisegundos
serenity.logging=quiet
serenity.take.screenshots=AFTER_EACH_STEP

environments {
  default {
    webdriver.base.url = "http://localhost:4200/petclinic"
  }
  dev {
    webdriver.base.url = "https://9de7-38-25-30-239.ngrok-free.app/petclinic"
    webdriver.driver = remote
    capabilities {
      browserName = "chrome"
      "goog:chromeOptions" = {
        args = ["--start-maximized"]
        prefs = {
          "ngrok-skip-browser-warning" = "true"
        }
      }
    }
  }
  test {
    webdriver.base.url = "https://spring-framework-petclinic-qctjpkmzuq-od.a.run.app"
  }
}

